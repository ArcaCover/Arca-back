# Publishes @arca/contracts as a tarball on a GitHub Release, so Arca-front can install it
# from a public URL without a registry account or an install token in Vercel.
#
# Release a new version:
#   1. Bump "version" in packages/contracts/package.json and merge to main.
#   2. git tag contracts-v<version> && git push origin contracts-v<version>
#   3. Point Arca-front's dependency at the new release URL.
name: Release contracts

on:
  push:
    tags: ['contracts-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/contracts/package.json').version")
          if [ "contracts-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - run: npm run build --workspace @arca/contracts

      - name: Pack
        run: npm pack --workspace @arca/contracts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" arca-contracts-*.tgz --title "$GITHUB_REF_NAME" --notes "Install with: npm install https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$(ls arca-contracts-*.tgz)"
