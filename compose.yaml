name: arca-demo

services:
  api:
    image: ${ARCA_IMAGE:?Set ARCA_IMAGE to an immutable ECR image tag}
    env_file:
      - ${ARCA_ENV_FILE:-.env.demo}
    expose:
      - "8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    shm_size: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DEMO_HOSTNAME: ${DEMO_HOSTNAME:?Set DEMO_HOSTNAME to the public DNS name}
      DOCS_AUTH_USER: ${DOCS_AUTH_USER:?Set DOCS_AUTH_USER to the documentation user}
      DOCS_AUTH_HASH: ${DOCS_AUTH_HASH:?Set DOCS_AUTH_HASH to a bcrypt hash from caddy hash-password}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
